name: Release PCK Patch

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2" # Match the Godot 4 version you use locally
  EXPORT_PRESET: "Android" # Must match the preset name in export_presets.cfg
  PATCH_NAME: "zombie_game_patch.pck"

jobs:
  release-pck:
    name: Export & Publish PCK Patch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export Godot PCK patch
        run: |
          mkdir -p build
          godot --headless --export-pack "$EXPORT_PRESET" "build/$PATCH_NAME"

      - name: Create GitHub Release and attach PCK
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.PATCH_NAME }}
          generate_release_notes: true
