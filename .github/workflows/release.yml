name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2" 
  EXPORT_PRESET: "Android"
  APK_NAME: "zombie_game.apk"

jobs:
  release-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Prepare Android signing keystore
        run: |
          mkdir -p android/build
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/build/release.keystore
          else
            keytool -genkey -v \
              -keystore android/build/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --export-release "$EXPORT_PRESET" "build/$APK_NAME"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APK_NAME }}
          generate_release_notes: true
